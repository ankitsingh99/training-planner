name: Daily OmniSync Pipeline

on:
  schedule:
    # 03:00 AM IST (Indian Standard Time, UTC+5:30) is 21:30 UTC of the previous day
    - cron: '30 21 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  omnisync:
    name: Run Daily OmniSync & Training Plan Reconciler
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Execute OmniSync (Live Apply)
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          COROS_ACCESS_TOKEN: ${{ secrets.COROS_ACCESS_TOKEN }}
          COROS_USER_ID: ${{ secrets.COROS_USER_ID }}
          PYTHONPATH: src
        run: |
          python -m intervals_plan.cli omnisync --apply --weeks 1

      - name: Commit Updated Manifest & Audit Logs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily omnisync manifest and audit update [skip ci]"
          file_pattern: "data/manifest.json data/audit.log"

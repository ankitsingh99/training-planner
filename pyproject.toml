[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptpulse"
version = "0.3.0"
description = "Sports science powered adaptive training suite and dynamic rolling planner for Intervals.icu"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ashish Singh" }]
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
adaptpulse = "intervals_plan.cli:main"
intervals-plan = "intervals_plan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

